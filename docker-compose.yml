services:
  notion-backup:
    build: .
    env_file: .env
    volumes:
      - ./downloads:/app/downloads
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Optional: set CRON_SCHEDULE to run on a schedule (runs once without it)
      # CRON_SCHEDULE: "0 3 * * *"  # daily at 3am
